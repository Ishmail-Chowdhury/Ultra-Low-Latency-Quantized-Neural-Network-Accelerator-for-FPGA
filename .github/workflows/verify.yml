name: Verify integer reference and RTL

on: [push, pull_request]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-training.txt
      - name: Install simulator and training packages
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python -m pip install -r requirements-training.txt
      - name: Validate software, exports, replay, and RTL from fresh models
        run: make validate-software
      - name: Evaluate expanding-window selection and class balancing
        run: make walk-forward
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-reports
          path: |
            build/software-validation/report.json
            build/software-validation/run-*/*.log
            build/software-validation/run-*/lob/*report.json
            build/software-validation/run-*/digits/*report.json
            build/lob-walk-forward/model/report.json
            build/lob-walk-forward/model/selection.json
            build/lob-walk-forward/model/rtl_report.json
            build/lob-walk-forward/model/replay_report.json
          if-no-files-found: error
