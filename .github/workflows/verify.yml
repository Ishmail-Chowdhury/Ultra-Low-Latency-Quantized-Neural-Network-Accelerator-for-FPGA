name: Verify integer reference and RTL

on: [push, pull_request]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-training.txt
      - name: Install simulator and training packages
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python -m pip install -r requirements-training.txt
      - name: Run arithmetic and RTL regression
        run: make test
      - name: Train, export, and verify the benchmark
        run: make benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: digits-reports
          path: |
            build/digits/report.json
            build/digits/rtl_report.json
          if-no-files-found: error
